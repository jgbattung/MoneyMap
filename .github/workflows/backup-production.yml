# Nightly encrypted backup of the production database.
#
# Design (spec: MM-027):
#   - Connects as the read-only login moneymap_readonly through the Supabase
#     Session pooler. It never writes to production, and no production write
#     credential exists in GitHub. Every run re-proves the login is read-only
#     before dumping.
#   - Dumps the public schema, restores the dump into a throwaway Postgres of
#     the same major version to prove it restores, then encrypts it with age to
#     the PUBLIC key in .github/backup-recipient.txt. The private key lives in
#     Bitwarden only, never in GitHub, so the restore check runs on the
#     plaintext before encryption.
#   - Uploads only the ciphertext and a counts-only manifest (90 days). The
#     repo is public: artifacts are downloadable by any signed-in GitHub user
#     and job summaries are public, so nothing but ciphertext, table names and
#     row counts is ever published.
#   - Never add a pull_request or pull_request_target trigger here: a fork PR
#     must never be able to reach BACKUP_DATABASE_URL.
name: backup-production

on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC = 02:00 Manila
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  backup:
    name: Dump, verify restore, encrypt, upload
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install -y age

      - name: Check backup recipient key
        run: bash scripts/backup/check-recipient.sh

      - name: Assert source URL is the read-only pooler login
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: bash scripts/backup/assert-source-url.sh

      - name: Detect server version
        id: detect
        env:
          PGURL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          num="$(docker run --rm -e PGURL postgres:17-alpine sh -c 'psql "$PGURL" -v ON_ERROR_STOP=1 -tA -c "show server_version_num"')"
          if ! [[ "$num" =~ ^[0-9]{6}$ ]]; then
            echo "Could not read server_version_num from the server" >&2
            exit 1
          fi
          major=$((num / 10000))
          case "$major" in
            15 | 16 | 17 | 18) ;;
            *)
              echo "Unsupported server major version: $major (allowed: 15 16 17 18)" >&2
              exit 1
              ;;
          esac
          echo "Server major version: $major"
          {
            echo "major=$major"
            echo "num=$num"
            echo "date=$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"

      - name: Prove the login is read-only
        env:
          PGURL: ${{ secrets.BACKUP_DATABASE_URL }}
          PG_MAJOR: ${{ steps.detect.outputs.major }}
        run: |
          set -euo pipefail
          who="$(docker run --rm -e PGURL "postgres:${PG_MAJOR}-alpine" sh -c 'psql "$PGURL" -v ON_ERROR_STOP=1 -tA -c "select current_user"')"
          if [ "$who" != "moneymap_readonly" ]; then
            echo "Connected as an unexpected role: $who" >&2
            exit 1
          fi
          result="$(docker run --rm -i -e PGURL "postgres:${PG_MAJOR}-alpine" sh -c 'psql "$PGURL" -v ON_ERROR_STOP=1 -tA -F "|" -f -' < scripts/db/verify-backup-role.sql)"
          echo "verify-backup-role result (role checks, write_grants, create_on_schemas, missing_select, ok):"
          echo "$result"
          if [ "${result##*|}" != "t" ]; then
            echo "The backup login is not read-only or cannot read every table. Refusing to dump." >&2
            exit 1
          fi

      - name: Dump production (public schema)
        env:
          PGURL: ${{ secrets.BACKUP_DATABASE_URL }}
          PG_MAJOR: ${{ steps.detect.outputs.major }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/upload"
          umask 077
          docker run --rm -e PGURL "postgres:${PG_MAJOR}-alpine" sh -c 'pg_dump --dbname="$PGURL" -Fc --schema=public --no-owner --no-privileges' > "$RUNNER_TEMP/work/backup.dump"
          docker run --rm "postgres:${PG_MAJOR}-alpine" pg_dump --version > "$RUNNER_TEMP/work/pg_dump_version.txt"
          sha256sum "$RUNNER_TEMP/work/backup.dump" | cut -d ' ' -f 1 > "$RUNNER_TEMP/work/backup.sha256"
          echo "Dump size: $(stat -c %s "$RUNNER_TEMP/work/backup.dump") bytes"

      - name: Prove the dump restores
        env:
          PG_MAJOR: ${{ steps.detect.outputs.major }}
        run: bash scripts/backup/restore-check.sh "$RUNNER_TEMP/work/backup.dump" "$PG_MAJOR" "$RUNNER_TEMP/work/counts.tsv"

      - name: Write manifest and job summary
        env:
          PG_MAJOR: ${{ steps.detect.outputs.major }}
          SERVER_VERSION_NUM: ${{ steps.detect.outputs.num }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/work"
          tables="$(jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {(.[0]): (.[1] | tonumber)}) | add' "$work/counts.tsv")"
          jq -n \
            --arg createdAtUtc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson serverVersionNum "$SERVER_VERSION_NUM" \
            --argjson pgMajor "$PG_MAJOR" \
            --arg pgDumpVersion "$(tr -d '\n' < "$work/pg_dump_version.txt")" \
            --arg sha256 "$(cat "$work/backup.sha256")" \
            --argjson dumpBytes "$(stat -c %s "$work/backup.dump")" \
            --argjson tables "$tables" \
            --arg runId "$RUN_ID" \
            '{createdAtUtc: $createdAtUtc, serverVersionNum: $serverVersionNum, pgMajor: $pgMajor, pgDumpVersion: $pgDumpVersion, sha256: $sha256, dumpBytes: $dumpBytes, tables: $tables, runId: $runId}' \
            > "$RUNNER_TEMP/upload/manifest.json"
          {
            echo "## Production backup restore check"
            echo
            echo "Restored into a throwaway Postgres $PG_MAJOR. Row counts only, no row contents."
            echo
            echo "| Table | Rows |"
            echo "| --- | ---: |"
            awk -F '\t' '{ printf "| %s | %s |\n", $1, $2 }' "$work/counts.tsv"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt dump
        run: |
          set -euo pipefail
          age -R .github/backup-recipient.txt -o "$RUNNER_TEMP/upload/backup.dump.age" "$RUNNER_TEMP/work/backup.dump"
          if [ "$(head -n 1 "$RUNNER_TEMP/upload/backup.dump.age")" != "age-encryption.org/v1" ]; then
            echo "Encrypted file does not have an age header" >&2
            exit 1
          fi
          shred -u "$RUNNER_TEMP/work/backup.dump" || rm -f "$RUNNER_TEMP/work/backup.dump"
          ls -l "$RUNNER_TEMP/upload"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: production-backup-${{ steps.detect.outputs.date }}-${{ github.run_id }}
          path: ${{ runner.temp }}/upload/
          retention-days: 90
          if-no-files-found: error

      - name: Clean up
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/work"
